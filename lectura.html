<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Lectura Bíblica | Expositiva</title>
    <link rel="stylesheet" href="css/estilo.css">
    <style>
        .lectura-container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        .mensaje {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 40px 24px;
            margin-bottom: 24px;
            box-shadow: var(--card-shadow);
        }

        .boton-biblia {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            text-decoration: none;
            display: inline-block;
        }

        .boton-biblia:hover {
            background: var(--primary-dark);
        }
        
        .back-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <button class="back-btn" onclick="window.location.href='index.html'">← Volver</button>
            </div>
            <div class="header-right">
                <button id="themeToggle" class="theme-btn" aria-label="Cambiar tema">🌙</button>
            </div>
        </header>

        <main class="main">
            <div class="lectura-container" id="lecturaContainer">
                <div class="loading-spinner">📖 Preparando...</div>
            </div>
        </main>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let pasaje = urlParams.get('pasaje');
        const estudioId = urlParams.get('estudioId');

        const container = document.getElementById('lecturaContainer');

        //MOSNTAR BIBLIA YOUVERSION
function formatearParaYouVersion(pasajeOriginal) {
    // 1. Limpiar el pasaje: "Apocalipsis 1:1-8" -> "apocalipsis 1:1-8"
    let pasajeLower = pasajeOriginal.toLowerCase().trim();
    
    // 2. Diccionario para traducir el nombre del libro al inglés (como lo pide YouVersion)
    const libros = {
        'apocalipsis': 'rev',
        'mateo': 'mat',
        'marcos': 'mrk',
        'lucas': 'luk',
        'juan': 'jhn',
        'hechos': 'act',
        'génesis': 'gen',
        'éxodo': 'exo'
        // Puedes añadir más libros si lo necesitas
    };
    
    let libroId = '';
    let restoPasaje = '';
    
    // 3. Buscar el libro en el diccionario
    for (let [espanol, id] of Object.entries(libros)) {
        if (pasajeLower.startsWith(espanol)) {
            libroId = id;
            restoPasaje = pasajeOriginal.substring(espanol.length).trim();
            break;
        }
    }
    
    if (libroId && restoPasaje) {
        // 4. Crear la URL para YouVersion
        // Ejemplo: "1:1-8" -> "1.1-8" (cambia : por .)
        let versiculos = restoPasaje.replace(/:/g, '.');
        // El ID 149 es para la Reina Valera 1960 (RVR1960)
        return `https://www.bible.com/es/bible/149/${libroId.toUpperCase()}.${versiculos}.REINA%20VALERA`;
    }
    
    // 5. Si hay un error (ej: libro no encontrado), usar búsqueda general
    return `https://www.bible.com/es/search/bible?query=${encodeURIComponent(pasajeOriginal)}`;
}


        function mostrarOpciones() {
            const bibleHubUrl = formatearParaYouVersion(pasaje); // <-- Línea nueva
            container.innerHTML = `
                <div class="mensaje">
                    <h3>📖 ${pasaje}</h3>
                    <p style="margin-top: 20px;">No fue posible mostrar el texto automáticamente debido a restricciones de seguridad del navegador.</p>
                    <p>Puedes leer el pasaje en:</p>
                    <a href="${bibleHubUrl}" target="_blank" class="boton-biblia">🔗 Abrir en YouVersion.com</a>
                    <br><br>
                    <div style="margin-top: 24px;">
                        <button id="verEstudioBtn" class="boton-biblia" style="background: #10b981;">📚 Ver estudio completo</button>
                    </div>
                </div>
            `;
            
            const btnEstudio = document.getElementById('verEstudioBtn');
            if (btnEstudio && estudioId) {
                btnEstudio.addEventListener('click', () => {
                    window.open(`estudio.html?id=${estudioId}`, '_blank');
                });
            } else if (btnEstudio) {
                btnEstudio.addEventListener('click', () => {
                    window.open(`estudio.html?referencia=${encodeURIComponent(pasaje)}`, '_blank');
                });
            }
        }

        mostrarOpciones();

        // Tema claro/oscuro
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
        
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
            themeToggle.textContent = '☀️';
        }
    </script>
</body>
</html>
