<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Expositiva | Estudios Bíblicos</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <h1>📖 EXPOSITIVA</h1>
            </div>
            <div class="header-right">
                <button id="themeToggle" class="theme-btn" aria-label="Cambiar tema">🌙</button>
            </div>
        </header>

        <main class="main">
            <div id="filasContainer">
                <!-- Las filas se cargan dinámicamente con JS -->
                <div class="loading">Cargando estudios...</div>
            </div>
        </main>
    </div>

    <script src="js/estudios.js"></script>
    <script>
        // Cargar configuración y renderizar
        async function cargarEstudios() {
            try {
                const response = await fetch('data/estudios.json');
                const data = await response.json();
                
                const container = document.getElementById('filasContainer');
                container.innerHTML = '';
                
                data.colecciones.forEach(coleccion => {
                    if (coleccion.estudios.length === 0) return;
                    
                    const filaHTML = `
                        <div class="fila">
                            <h2 class="fila-titulo">${coleccion.nombre}</h2>
                            <div class="fila-scroll">
                                <div class="tarjetas-container">
                                    ${coleccion.estudios.map(estudio => `
                                        <div class="tarjeta" data-referencia="${estudio.referencia}" data-id="${estudio.id}">
                                            <div class="tarjeta-imagen">
                                                <img src="${estudio.imagen}" alt="${estudio.titulo}" loading="lazy">
                                            </div>
                                            <div class="tarjeta-contenido">
                                                <h3 class="tarjeta-titulo">${estudio.referencia}</h3>
                                                <p class="tarjeta-descripcion">${estudio.titulo}</p>
                                                <button class="tarjeta-boton">📖 Ver estudio</button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += filaHTML;
                });
                
                // Agregar eventos a las tarjetas
                document.querySelectorAll('.tarjeta').forEach(tarjeta => {
                    tarjeta.addEventListener('click', () => {
                        const referencia = tarjeta.dataset.referencia;
                        const id = tarjeta.dataset.id;
                        // Abrir lectura.html con el pasaje y el id del estudio
                        window.location.href = `lectura.html?pasaje=${encodeURIComponent(referencia)}&estudioId=${id}`;
                    });
                });
                
            } catch (error) {
                console.error('Error cargando estudios:', error);
                document.getElementById('filasContainer').innerHTML = '<div class="error">Error al cargar los estudios</div>';
            }
        }
        
        cargarEstudios();
        
        // Tema claro/oscuro
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
        
        // Cargar tema guardado
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
            themeToggle.textContent = '☀️';
        }
    </script>
</body>
</html>
